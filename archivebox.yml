---
apiVersion: v1
kind: Namespace
metadata:
  name: archivebox
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archivebox
  namespace: archivebox
spec:
  # Uses the cluster's default StorageClass. Choose reliable block-backed storage;
  # do not put the SQLite database on NFS/SMB. Adjust capacity for your archive.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivebox
  namespace: archivebox
spec:
  replicas: 1
  # One server/orchestrator owns the collection; stop it before replacing it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: archivebox
  template:
    metadata:
      labels:
        app: archivebox
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: archivebox
          image: archivebox/archivebox:dev
          imagePullPolicy: Always
          # Inherit the image's server --init command and privilege-dropping entrypoint.
          ports:
            - containerPort: 5797
              name: http
          env:
            - name: PUBLIC_ADD_VIEW
              value: "False"
            # Set BASE_URL and SERVER_SECURITY_MODE here to override the setup wizard.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: admin.archivebox.localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/
              port: http
              httpHeaders:
                - name: Host
                  value: admin.archivebox.localhost
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: archivebox
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: archivebox
          persistentVolumeClaim:
            claimName: archivebox
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: archivebox
  namespace: archivebox
spec:
  type: ClusterIP
  selector:
    app: archivebox
  ports:
    - name: http
      port: 5797
      targetPort: http
